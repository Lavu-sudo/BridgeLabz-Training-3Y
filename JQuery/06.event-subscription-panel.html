<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Panel</title><style>
body{font-family:Arial;padding:25px;background:#f8fafc}.panel{max-width:650px;margin:auto;background:white;padding:22px;border-radius:10px}.topic{padding:10px;border-bottom:1px solid #ddd}.topic button{float:right}.controls{margin:15px 0}button{padding:8px 12px;cursor:pointer}#message{color:#15803d;font-weight:bold}
</style><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="06.event-subscription-panel.js" defer></script></head><body><main class="panel"><h1>Event Subscription Panel</h1><p id="status">Notifications are disabled.</p><div class="controls"><button id="subscribe">Subscribe</button><button id="unsubscribe">Unsubscribe</button></div>

<div class="topic">Technology <button class="remove">Remove</button></div><div class="topic">Sports <button class="remove">Remove</button></div><div class="topic">Education <button class="remove">Remove</button></div><div class="topic">Events <button class="remove">Remove</button></div><div class="topic">Offers <button class="remove">Remove</button></div>
</div><p id="message" aria-live="polite"></p></main></body></html>
